];
function mk(a){return '<button class="appbtn" data-app="'+a[0]+'"><span class="appicon" style="background:'+a[2]+'">'+a[3]+'</span><span class="appname">'+a[1]+'</span></button>'}
function findApp(id){return apps.filter(function(a){return a[0]===id})[0]}

/* ----- 화면 전환 ----- */
function switchScreen(id){
  ['lock','passcodeScreen','home','ending'].forEach(function(s){$(s).classList.toggle('active',s===id)});
}
function showLock(){closeApp(true);switchScreen('lock')}
function showHome(){switchScreen('home')}
function showPasscode(){entered='';updateDots();$('passError').textContent='';switchScreen('passcodeScreen')}
function updateDots(){
  document.querySelectorAll('.pass-dot').forEach(function(d,i){d.classList.toggle('filled',i<entered.length)});
}
function pressDigit(n){
  if(entered.length>=4)return;
  entered+=n;updateDots();
  if(entered.length===4){
    setTimeout(function(){
      if(entered===PASSCODE){wrong=0;showHome()}
      else{
        wrong++;entered='';updateDots();
        var d=$('passDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
        $('passError').textContent=wrong>=5?'time to sleep':'암호가 맞지 않습니다';
      }
    },120);
  }
}
function deleteDigit(){entered=entered.slice(0,-1);updateDots()}

function setPage(html){
  var c=$('content');c.innerHTML=html;
  c.classList.remove('push');void c.offsetWidth;c.classList.add('push');c.scrollTop=0;
}
function openApp(id,el){
  if(id==='archive'&&required.every(function(c){return clues.has(c)})){switchScreen('ending');return}
  var p=phone.getBoundingClientRect(),r=el.getBoundingClientRect(),s=$('appscreen');
  s.style.transformOrigin=(r.left+r.width/2-p.left)+'px '+(r.top+r.height/2-p.top)+'px';
  curApp=id;render(id);
  requestAnimationFrame(function(){
    s.classList.add('active');$('home').classList.add('under');phone.classList.add('light');
  });
}
function closeApp(instant){
  if(!curApp)return;
  curApp=null;
  var s=$('appscreen');
  if(instant)s.style.transition='none';
  s.classList.remove('active');$('home').classList.remove('under');phone.classList.remove('light');
  if(instant)requestAnimationFrame(function(){s.style.transition=''});
}
function toast(t,d){
  var old=document.querySelector('.toast');if(old)old.remove();
  var e=document.createElement('div');e.className='toast';
  e.innerHTML='<b>'+t+'</b><div style="font-size:14px;margin-top:3px">'+d+'</div>';
  phone.appendChild(e);setTimeout(function(){e.remove()},2400);
}

/* ----- 공통 UI ----- */
function tb(l,f){return '<button class="back" onclick="'+(f||'closeApp()')+'">‹ '+l+'</button>'}
function ttl(t){return '<div class="title">'+t+'</div>'}
function grp(r){return '<div class="group">'+r.join('')+'</div>'}
function row(t,d,ic,act,rt){
  return '<button class="row" '+(act?'onclick="'+act+'"':'')+'>'+(ic||'')+'<span class="rowmain"><div class="rowtitle">'+t+'</div>'+(d?'<div class="detail">'+d+'</div>':'')+'</span>'+(rt?'<span class="rt">'+rt+'</span>':'')+'<span class="chev">›</span></button>';
}
function av(k){return '<span class="avatar" style="background:'+CONTACTS[k].color+'">'+k+'</span>'}
var unk='<span class="avatar" style="background:#c7c7cc">?</span>';
function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function render(id){
  var v={photos:photosView,messages:messagesView,phone:phoneView,camera:cameraView,maps:mapsView,notes:notesView,clock:clockView,contacts:contactsView,settings:settingsView,archive:archiveView};
  (v[id]||clockView)();
}

/* ----- 사진 ----- */
function photoKey(n){return '0317_photo'+n}
function getPhoto(n){try{return localStorage.getItem(photoKey(n))}catch(e){return null}}
function srcOf(n){return getPhoto(n)||('images/photo'+n+'.jpeg')}
function photosView(){
  var s=[1,2,3,4].map(function(n){
    return '<button class="slot" id="slot'+n+'" onclick="slotTap('+n+')">+<img src="'+srcOf(n)+'" alt="" onerror="this.remove()"></button>';
  }).join('');
  setPage(tb('홈')+ttl('사진')+'<p class="muted" style="margin:-8px 0 12px">빈칸을 탭하면 이미지를 올릴 수 있어요</p><div class="photos">'+s+'</div>');
}
function slotTap(n){
  if($('slot'+n).querySelector('img'))photoDetail(n);else upload(n);
}
function upload(n){pickSlot=n;$('picker').value='';$('picker').click()}
$('picker').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){
    var k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*k;c.height=img.height*k;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    try{localStorage.setItem(photoKey(pickSlot),c.toDataURL('image/jpeg',0.82))}catch(x){toast('사진','저장 공간이 부족합니다.')}
    URL.revokeObjectURL(u);photosView();
  };
  img.src=u;
});
function photoDetail(n){
  clues.add('photo');
  setPage(tb('사진','photosView()')+'<img class="detailimage" src="'+srcOf(n)+'" alt="" style="margin-top:8px"><p style="line-height:1.8">10월 21일 · 오전 3:17<br><span class="muted">위치 정보 없음</span></p><div class="btns"><button class="action gray" onclick="upload('+n+')">이미지 변경</button><button class="action gray" style="color:#ff3b30" onclick="delPhoto('+n+')">삭제</button></div>');
}
function delPhoto(n){try{localStorage.removeItem(photoKey(n))}catch(e){}photosView()}

/* ----- 메시지 ----- */
function messagesView(){
  var rows=['W','J'].map(function(k){
    var l=chat[k][chat[k].length-1];
    return row(k,esc(l[1]),av(k),"thread('"+k+"')",'어제');
  });
  setPage(tb('홈')+ttl('메시지')+grp(rows));
}
function thread(k){
  if(k==='W')clues.add('message');
  var last='';
  var bs=chat[k].map(function(m){
    var h='';
    if(m[2]&&m[2]!==last){h='<div class="center">'+m[2]+'</div>';last=m[2]}
    return h+'<div class="bubble '+m[0]+'">'+esc(m[1])+'</div>';
  }).join('');
  var chips=SUGGEST[k].map(function(s,i){
    return usedSug[k][i]?'':'<button class="chip" data-i="'+i+'" onclick="sendChip('+i+')">'+esc(s)+'</button>';
  }).join('');
  setPage(tb('메시지','messagesView()')+'<div class="chead">'+av(k)+'<span>'+k+'</span></div><div class="bubbles" id="bubbles" data-k="'+k+'">'+bs+'</div><div class="composer"><div class="chips" id="chips"'+(chips?'':' style="display:none"')+'>'+chips+'</div><div class="inputrow"><input id="reply" placeholder="iMessage" autocomplete="off"><button onclick="sendReply()">↑</button></div></div>');
  $('content').scrollTop=100000;
}
function sendChip(i){
  var k=$('bubbles').dataset.k;
  usedSug[k][i]=true;
  var b=document.querySelector('.chip[data-i="'+i+'"]');if(b)b.remove();
  if(!$('chips').children.length)$('chips').style.display='none';
  sendReply(SUGGEST[k][i]);
}
function addBubble(t,kind){
  var b=document.createElement('div');b.className='bubble '+kind;b.textContent=t;
  $('bubbles').appendChild(b);$('content').scrollTo({top:100000,behavior:'smooth'});
  return b;
}
function sendReply(text){
  var i=$('reply');
  var msg=text||(i?i.value.trim():'');
  if(!msg)return;
  if(!text&&i)i.value='';
  var k=$('bubbles').dataset.k;
  addBubble(msg,'out');chat[k].push(['out',msg]);
  var hit=RULES[k].filter(function(r){return r[0].test(msg)})[0];
  var ans=hit?hit[1]:fallback[k];
  setTimeout(function(){
    var t=addBubble('•••','in');t.classList.add('typing');
    setTimeout(function(){
      t.classList.remove('typing');t.textContent=ans;chat[k].push(['in',ans]);
      if(hit&&hit[2])clues.add(hit[2]);
      $('content').scrollTo({top:100000,behavior:'smooth'});
    },900+Math.min(ans.length*30,900));
  },400);
}

/* ----- 시작 ----- */
function restart(){clues.clear();wrong=0;usedSug={J:{},W:{}};showLock()}
$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9].map(function(n){return '<button class="key" onclick="pressDigit(\''+n+'\')">'+n+'</button>'}).join('')+
  '<button class="key blank" tabindex="-1"></button><button class="key" onclick="pressDigit(\'0\')">0</button><button class="key sm" onclick="deleteDigit()">삭제</button>';
$('grid').innerHTML=apps.filter(function(a){return ['phone','messages','camera','photos'].indexOf(a[0])<0}).map(mk).join('');
$('dock').innerHTML=['phone','messages','photos','camera'].map(function(id){return mk(findApp(id))}).join('');

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-app]');
  if(b)openApp(b.dataset.app,b.querySelector('.appicon'));
});
$('homebar').addEventListener('click',function(){
  if($('ending').classList.contains('active'))return restart();
  if(curApp)closeApp();
  else if($('home').classList.contains('active'))showLock();
  else if($('lock').classList.contains('active'))showPasscode();
});
var sy=0;
$('lock').addEventListener('touchstart',function(e){sy=e.touches[0].clientY},{passive:true});
$('lock').addEventListener('touchend',function(e){if(sy-e.changedTouches[0].clientY>35)showPasscode()},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&$('reply'))sendReply();
  if(e.key==='Escape'){if(curApp)closeApp();else showLock()}
});
