<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="0317">
<meta name="theme-color" content="#000">
<title>0317</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
.phone{position:relative;width:min(390px,100vw);height:min(844px,100dvh);min-height:560px;margin:auto;overflow:hidden;border:3px solid #444;border-radius:48px;background:#000;box-shadow:0 15px 60px #000a}
@media(max-width:430px){.phone{width:100vw;height:100dvh;border:0;border-radius:0}}
.screen{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.06);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility .45s}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.island{position:absolute;z-index:60;top:11px;left:50%;width:112px;height:32px;margin-left:-56px;background:#000;border-radius:20px;pointer-events:none}
.status{position:absolute;z-index:55;top:0;left:0;right:0;height:50px;padding:16px 30px 0 34px;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;pointer-events:none;transition:color .3s}
.status svg{height:12px;fill:currentColor;margin-left:5px}.status .r{display:flex;align-items:center}
.phone.light .status{color:#000}
.lock{display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 30%,#6a6d85,#2d3042 45%,#0c0d13 85%);touch-action:pan-y}
.lock .lk{margin-top:62px;font-size:20px;opacity:.9}
.date{margin-top:6px;font-size:19px;font-weight:500;opacity:.85}
.time{font-size:96px;font-weight:600;letter-spacing:-3px;line-height:1.05}
.lockbottom{margin-top:auto;width:100%;display:flex;justify-content:space-between;padding:0 44px 62px}
.circle{width:50px;height:50px;border:0;border-radius:50%;background:#ffffff2e;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;transition:transform .15s}
.circle:active{transform:scale(.9);background:#ffffff55}.circle svg{width:22px;height:22px;fill:#fff}
.swipe{position:absolute;bottom:26px;width:100%;text-align:center;font-size:12px;color:#ffffffa0}
.bar-hitbox{position:absolute;z-index:70;left:calc(50% - 70px);width:140px;bottom:0;height:26px;background:none;border:0;padding:0}
.bar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:5px;background:#fff;pointer-events:none;transition:background .3s}
.phone.light .bar{background:#000}
.passcode{display:flex;flex-direction:column;align-items:center;padding:95px 35px 35px;background:radial-gradient(ellipse at 50% 35%,#4a4c60,#14151d 78%)}
.pass-title{font-size:20px;margin-bottom:26px}
.pass-dots{display:flex;gap:18px;margin-bottom:14px}
.pass-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pass-dot{width:12px;height:12px;border:1px solid #fffc;border-radius:50%;transition:background .1s}.pass-dot.filled{background:#fff}
.pass-error{min-height:26px;font-size:15px;color:#ffffffc0}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;margin-top:auto;margin-bottom:22px}
.key{width:76px;height:76px;border-radius:50%;border:0;background:#ffffff26;font-size:32px;font-weight:300;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .25s}
.key:active{background:#ffffff66;transition:none}.key.blank{visibility:hidden}.key.sm{font-size:15px;background:none}
.hint{border:0;background:none;color:#fff;font-size:15px;padding:10px}
.home{padding:62px 20px 20px;background:radial-gradient(ellipse at 20% 5%,#6a6d8c,transparent 45%),radial-gradient(ellipse at 85% 75%,#4a3f63,transparent 50%),linear-gradient(160deg,#2b2e45,#0e0f16);transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1),visibility .45s,filter .45s}
.home.under{transform:scale(.92);filter:brightness(.6)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 6px}
.appbtn{border:0;padding:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
.appbtn:active{transform:scale(.9)}
.appicon{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 4px #0005,inset 0 0 0 .5px #ffffff22}
.appicon svg{width:34px;height:34px;fill:#fff}
.appname{font-size:11px;font-weight:500;text-shadow:0 1px 3px #0008}
.dock{position:absolute;left:12px;right:12px;bottom:26px;height:88px;border-radius:32px;background:#ffffff2e;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:space-evenly}
.dock .appname{display:none}
.dots{position:absolute;bottom:122px;left:0;right:0;display:flex;justify-content:center;gap:8px}.dots i{width:7px;height:7px;border-radius:50%;background:#ffffff55}.dots i:first-child{background:#fff}
.appscreen{z-index:20;background:#f2f2f7;color:#1c1c1e;transform:scale(.12);border-radius:46px;transition:opacity .3s ease,transform .5s cubic-bezier(.2,.8,.2,1),border-radius .5s,visibility .5s}
.appscreen.active{border-radius:0}
.content{position:absolute;inset:50px 0 0;overflow:auto;padding:6px 20px 90px;overscroll-behavior:contain}
.content.push{animation:push .38s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
.back{border:0;background:none;color:#087aff;padding:6px 0;font-size:17px}
.title{font-size:34px;font-weight:700;margin:8px 0 18px;letter-spacing:-.5px}
.muted{color:#8e8e93}
.group{background:#fff;border-radius:12px;padding:0 14px;margin:14px 0}
.row{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-bottom:1px solid #e3e3e8;background:none;text-align:left;color:#1c1c1
