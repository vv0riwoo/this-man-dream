function switchScreen(id){

function updateDots(){
  document.querySelectorAll('.pass-dot').forEach(function(d,i){d.classList.toggle('filled',i<entered.length)});
}
function pressDigit(n){
  if(entered.length>=4)return;
  entered+=n;updateDots();
  if(entered.length===4){
    setTimeout(function(){
      if(entered===PASSCODE){wrong=0;showHome()}
      else{
        wrong++;entered='';updateDots();
        var d=$('passDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
        $('passError').textContent=wrong>=5?'time to sleep':'암호가 틀렸어요';

    },120);
  }
}

function openApp(id,el){
  if(id==='camera'){toast('카메라','지금은 열 수 없어요.');return}
  if(id==='archive'&&required.every(function(c){return clues.has(c)})){switchScreen('ending');return}
  var p=phone.getBoundingClientRect(),r=el.getBoundingClientRect(),s=$('appscreen');
  s.style.transformOrigin=(r.left+r.width/2-p.left)+'px '+(r.top+r.height/2-p.top)+'px';
  s.classList.toggle('dk',id==='maps');
  curApp=id;render(id);

    s.classList.add('active');$('home').classList.add('under');
    if(id!=='maps')phone.classList.add('light');
  });

function closeApp(instant){
  if(!curApp)return;
  cancelCall();stopGlitch();
  curApp=null;
  var s=$('appscreen');
  if(instant)s.style.transition='none';
  s.classList.remove('active');$('home').classList.remove('under');phone.classList.remove('light');
  if(instant)requestAnimationFrame(function(){s.style.transition=''});
}

var photoSrc={};
function loadInto(img,i,cb){
  var base=PHOTOS[i],c=0;
  var list=[base];
  if(/^images\//.test(base))list.push(base.replace(/^images\//,''));
  (function next(){
    if(photoSrc[i]){img.src=photoSrc[i];if(cb)cb();return}
    if(c>=list.length){img.remove();console.warn('사진을 찾지 못했어요:',base);return}
    var t=new Image(),u=list[c++];
    t.onload=function(){photoSrc[i]=u;img.src=u;if(cb)cb()};
    t.onerror=next;t.src=u;
  })();
}
function photosView(){
  var s=PHOTOS.map(function(p,i){return '<button class="slot" id="slot'+i+'" onclick="slotTap('+i+')"><img alt=""></button>'}).join('');
  setPage(tb('홈')+ttl('사진')+'<p class="muted" style="margin:-8px 0 12px">최근 항목 · '+PHOTOS.length+'장</p><div class="photos">'+s+'</div>');
  PHOTOS.forEach(function(p,i){
    var img=$('slot'+i).querySelector('img');
    loadInto(img,i,function(){$('slot'+i).classList.add('ok')});
  });
}
function slotTap(i){

  photoDetail(i);

function thread(k){
  if(k==='W')clues.add('message');
  var last='';
  var bs=chat[k].map(function(m){
    var h='';
    if(m[2]&&m[2]!==last){h='<div class="center">'+m[2]+'</div>';last=m[2]}
    return h+'<div class="bubble '+m[0]+'">'+esc(m[1])+'</div>';
  }).join('');
  var chips=SUGGEST[k].map(function(s,i){
    return usedSug[k][i]?'':'<button class="chip" data-i="'+i+'" onclick="sendChip('+i+')">'+esc(s)+'</button>';
  }).join('');
  setPage(tb('메시지','messagesView()')+'<div class="chead">'+av(k)+'<span>'+k+'</span></div><div class="bubbles" id="bubbles" data-k="'+k+'">'+bs+'</div><div class="composer"><div class="chips" id="chips"'+(chips?'':' style="display:none"')+'>'+chips+'</div><div class="inputrow"><input id="reply" placeholder="iMessage" autocomplete="off"><button onclick="sendReply()">↑</button></div></div>');

}
function sendChip(i){
  var k=$('bubbles').dataset.k;
  usedSug[k][i]=true;
  var b=document.querySelector('.chip[data-i="'+i+'"]');if(b)b.remove();
  if(!$('chips').children.length)$('chips').style.display='none';
  sendReply(SUGGEST[k][i]);
}
function addBubble(t,kind){
  var b=document.createElement('div');b.className='bubble '+kind;b.textContent=t;
  $('bubbles').appendChild(b);$('content').scrollTo({top:100000,behavior:'smooth'});
  return b;
}
function sendReply(text){
  var i=$('reply');
  var msg=text||(i?i.value.trim():'');
  if(!msg)return;
  if(!text&&i)i.value='';
  var k=$('bubbles').dataset.k;
  addBubble(msg,'out');chat[k].push(['out',msg]);
  var hit=RULES[k].filter(function(r){return r[0].test(msg)})[0];
  var ans=hit?hit[1]:fallback[k];
  setTimeout(function(){
    var t=addBubble('•••','in');t.classList.add('typing');
    setTimeout(function(){
      t.classList.remove('typing');t.textContent=ans;chat[k].push(['in',ans]);
      if(hit&&hit[2])clues.add(hit[2]);
      $('content').scrollTo({top:100000,behavior:'smooth'});
    },900+Math.min(ans.length*30,900));
  },400);
}

/* 전화 걸기: 연결음 → 끊김 → 문자 수신 */
function ringTone(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    var g=actx.createGain();g.gain.value=0;g.connect(actx.destination);
    [440,480].forEach(function(f){
      var o=actx.createOscillator();o.frequency.value=f;o.connect(g);o.start();o.stop(actx.currentTime+5.4);
    });
    var t=actx.currentTime;
    [0,2.4].forEach(function(s){g.gain.setValueAtTime(0.08,t+s);g.gain.setValueAtTime(0,t+s+1.2)});
    ringNode=g;
  }catch(e){}
}
function stopRing(){
  try{if(ringNode){ringNode.gain.cancelScheduledValues(0);ringNode.gain.value=0;ringNode.disconnect();ringNode=null}}catch(e){}
}
function cancelCall(){
  clearTimeout(callT);callT=null;stopRing();
  $('callui').classList.remove('on');
}
function placeCall(k){
  callK=k;
  $('callui').innerHTML='<div class="avatar big" style="background:'+CONTACTS[k].color+'">'+k+'</div><h2>'+k+'</h2><p id="cs">발신 중…</p><button class="endcall" onclick="endCall(true)" aria-label="통화 종료"><svg viewBox="0 0 24 24"><path d="'+PHONE_PATH+'"/></svg></button>';
  $('callui').classList.add('on');phone.classList.remove('light');
  ringTone();
  callT=setTimeout(function(){
    stopRing();$('cs').textContent='통화 종료';
    callT=setTimeout(function(){endCall(false)},900);
  },5400);
}
function endCall(manual){
  var k=callK;
  cancelCall();
  if(curApp)phone.classList.add('light');
  if(manual)return;
  setTimeout(function(){
    var list=CALL_REPLY[k],msg=list[callN[k]%list.length];
    callN[k]++;
    chat[k].push(['in',msg]);
    toast('메시지 · '+k,esc(msg));
  },1200);
}

/* ----- 지도 (UNFIND) ----- */
var GLITCH_TEXT=['UN\u0337FIND','UNF\u2588ND','U\u0336N\u0337F\u0338I\u0336N\u0335D','UNFIND','\u2588NFIND','UNFIN\u2588'];
function mapsView(){
  setPage('<div class="dark">'+tb('홈')+ttl('지도')+'<div class="search" style="margin-bottom:12px">⌕ 지도 검색</div><div class="mapbox"><div class="pin"></div></div><div class="loc"><small>현재 위치</small><br><span class="glitch" data-text="UNFIND">UNFIND</span></div></div>');
  startGlitch();
}
function startGlitch(){
  stopGlitch();
  glT=setInterval(function(){
    var el=document.querySelector('.glitch');
    if(!el){stopGlitch();return}
    if(Math.random()<0.4){
      var t=GLITCH_TEXT[Math.floor(Math.random()*GLITCH_TEXT.length)];
      el.textContent=t;el.setAttribute('data-text',t);
      setTimeout(function(){el.textContent='UNFIND';el.setAttribute('data-text','UNFIND')},110);
    }
  },800);
}
function stopGlitch(){if(glT){clearInterval(glT);glT=null}}

/* ----- 시작 ----- */
function restart(){clues.clear();wrong=0;usedSug={J:{},W:{}};callN={J:0,W:0};showLock()}
$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9].map(function(n){return '<button class="key" onclick="pressDigit(\''+n+'\')">'+n+'</button>'}).join('')+
  '<button class="key blank" tabindex="-1"></button><button class="key" onclick="pressDigit(\'0\')">0</button><button class="key sm" onclick="deleteDigit()">삭제</button>';
$('grid').innerHTML=apps.filter(function(a){return DOCK.indexOf(a[0])<0}).map(mk).join('');
$('dock').innerHTML=DOCK.map(function(id){return mk(findApp(id))}).join('');

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-app]');
  if(b)openApp(b.dataset.app,b.querySelector('.appicon'));
});
$('homebar').addEventListener('click',function(){
  if($('ending').classList.contains('active'))return restart();
  if(curApp)closeApp();
  else if($('home').classList.contains('active'))showLock();
  else if($('lock').classList.contains('active'))showPasscode();
});
var sy=0;
$('lock').addEventListener('touchstart',function(e){sy=e.touches[0].clientY},{passive:true});
$('lock').addEventListener('touchend',function(e){if(sy-e.changedTouches[0].clientY>35)showPasscode()},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&$('reply'))sendReply();
  if(e.key==='Escape'){if(curApp)closeApp();else showLock()}
});
</script>
